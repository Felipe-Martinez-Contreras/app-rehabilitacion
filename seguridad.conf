# Encabezados de seguridad. Se incluyen en cada "location" de nginx.conf: en nginx,
# un add_header dentro de un location anula los heredados del server, así que
# ponerlos solo a nivel server no los enviaría.

# La cámara solo para esta misma página; el micrófono y la ubicación, nunca.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;

# Todo se carga desde este mismo origen y no se permite ninguna conexión a otros
# dominios (connect-src 'self'). 'wasm-unsafe-eval' es lo que MediaPipe necesita
# para compilar su WebAssembly; no habilita eval() de JavaScript.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
